<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Nunito; font-weight: 400; src: url(fonts/nunito-latin-400-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2600-27BF; }
  @font-face { font-family: Nunito; font-weight: 400; src: url(fonts/nunito-cyrillic-400-normal.woff2); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Nunito; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2600-27BF; }
  @font-face { font-family: Nunito; font-weight: 700; src: url(fonts/nunito-cyrillic-700-normal.woff2); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Nunito; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2600-27BF; }
  @font-face { font-family: Nunito; font-weight: 800; src: url(fonts/nunito-cyrillic-800-normal.woff2); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Caveat; font-weight: 600; src: url(fonts/caveat-latin-600-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Caveat; font-weight: 600; src: url(fonts/caveat-cyrillic-600-normal.woff2); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Caveat; font-weight: 700; src: url(fonts/caveat-latin-700-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Caveat; font-weight: 700; src: url(fonts/caveat-cyrillic-700-normal.woff2); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { width: 540px; height: 960px; display: block; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="engine.js"></script>
<script>
  const ep = new URLSearchParams(location.search).get('ep') || 'ep02';
  const load = src => new Promise(res => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = res; document.body.appendChild(el); });
  (async () => {
    await load('episodes/' + ep + '.captions.js'); // необязательный файл с таймингами (tools/align.py)
    await load('episodes/' + ep + '.js');
    // Force every font face to load before the first frame.
    const probe = ['Nunito', 'Caveat'].flatMap(f => [400, 600, 700, 800].map(w => `${w} 40px ${f}`));
    await Promise.all(probe.flatMap(p => [document.fonts.load(p, 'абв abc'), document.fonts.load(p, 'xyz')]));
    await document.fonts.ready;
    window.render(0, { captions: true });
    window.ready = true;
  })();
</script>
</body>
</html>
